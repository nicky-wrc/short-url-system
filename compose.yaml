services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shorturl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: shorturl
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorturl -d shorturl"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://shorturl:${POSTGRES_PASSWORD}@db:5432/shorturl
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in root .env}
      AUTH_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost:3000}
      PORT: 3000
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
